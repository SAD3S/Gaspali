name: Android – build & release

# - Tag « v* » (ex. v0.1.0) : construit l'APK et le publie dans une Release GitHub.
# - Lancement manuel (Actions › Run workflow) avec une version (ex. 0.3.0) : même chose, le tag
#   v0.3.0 est créé sur le commit choisi. Sans version : simple build de test.
# - Push sur une branche : construit l'APK (artefact téléchargeable), sans Release.
# - Avec la clé d'upload (secrets ANDROID_*), une release contient aussi l'AAB pour le Play Store.
#
# Caches : GitHub ne partage un cache qu'avec la même branche/tag ou avec la branche par défaut.
# Les builds de branche sont donc rapides dès le 2e passage ; ceux des tags le deviennent
# une fois que la branche par défaut (main) a été construite.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**', 'design/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 0.3.0). Vide : build de test sans release.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Un nouveau push annule le build de branche en cours, jamais une release lancée à la main.
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      # Projet Supabase : variables du dépôt (Settings › Secrets and variables › Actions › Variables)
      # si elles existent, sinon le projet du foyer. L'URL et la clé « publishable » sont publiques par
      # conception (intégrées à l'APK) : les données sont protégées par la RLS côté serveur.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nqhdyrjidvjrahkfobbz.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_e31UTzNKS-tbM8JY5oya6w_k_5A5789' }}
      # Facultatif : contact, page de confidentialité, rapports de plantage (vides → masqués / désactivés).
      EXPO_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      EXPO_PUBLIC_PRIVACY_URL: ${{ vars.PRIVACY_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      # « 1 » quand le fournisseur Google est configuré dans Supabase (sinon le bouton est masqué).
      EXPO_PUBLIC_AUTH_GOOGLE: ${{ vars.AUTH_GOOGLE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Vérifications (types + tests)
        run: |
          npx tsc --noEmit
          npm test -- --ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: SDK Android (préinstallé sur le runner) – licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Par défaut, seul main écrit le cache : on l'autorise partout.
          cache-read-only: false

      # Cache de compilation C++ (React Native, Reanimated, Worklets, Screens, modules Expo…).
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 2G

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ -n "${VERSION:-}" ]]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version invalide « $VERSION » (attendu : 1.2.3)"
              exit 1
            fi
            {
              echo "APP_VERSION=$VERSION"
              echo "RELEASE_TAG=v$VERSION"
              echo "EXPO_PUBLIC_APP_ENV=production"
            } >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_APP_ENV=preview" >> "$GITHUB_ENV"
          fi
          # versionCode Android : doit toujours augmenter pour installer par-dessus.
          echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Clé de signature (si configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "GASPALLI_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore"
              echo "GASPALLI_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
              echo "GASPALLI_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "GASPALLI_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
              echo "HAS_UPLOAD_KEY=true"
            } >> "$GITHUB_ENV"
            echo "Signature avec la clé du dépôt."
          else
            echo "::warning::Aucune clé configurée : APK signé avec la clé de debug standard (test uniquement)."
          fi

      - name: Projet natif (expo prebuild)
        env:
          # Sentry : envoi des « source maps » seulement si un jeton est configuré (sinon désactivé).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilation APK
        working-directory: android
        env:
          # CMake (≥ 3.17) lit ces variables : chaque compilation C/C++ passe par ccache.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Chemins et dates de node_modules changent à chaque checkout : on ne s'y fie pas.
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,file_stat_matches,pch_defines
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_ALLOW_FAILURE: 'true'
        # arm64-v8a : tous les téléphones Android récents ; compile ~4× plus vite que toutes les ABI.
        # --build-cache : réutilise les sorties Java/Kotlin/dex déjà produites.
        # Mémoire : R8 manquait de Metaspace avec les 2 Go / 512 Mo par défaut.
        # -x lintVitalRelease : le lint n'apporte rien à un APK de test (~15 s).
        run: >
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          --build-cache --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          -x lintVitalRelease

      # Play Store : un « Android App Bundle » signé avec la clé d'upload (releases seulement).
      - name: Bundle Play Store (AAB)
        if: env.RELEASE_TAG && env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_ALLOW_FAILURE: 'true'
        run: >
          ./gradlew bundleRelease
          -PreactNativeArchitectures=arm64-v8a
          --build-cache --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          -x lintVitalRelease

      - name: Statistiques ccache
        if: always()
        run: ccache --show-stats || true

      - name: Nommer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/gaspalli-${APP_VERSION}.apk"
          if [[ -f android/app/build/outputs/bundle/release/app-release.aab ]]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/gaspalli-${APP_VERSION}-play-store.aab"
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: gaspalli-${{ env.APP_VERSION }}
          path: dist/*

      - name: Release GitHub
        if: env.RELEASE_TAG
        uses: softprops/action-gh-release@v2
        with:
          # Lancement manuel : le tag est créé sur le commit construit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          prerelease: ${{ startsWith(env.RELEASE_TAG, 'v0.') }}
          body_path: docs/release-notes.md
          generate_release_notes: true
