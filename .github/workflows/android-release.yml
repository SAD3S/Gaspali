name: Android – build & release

# - Tag « v* » (ex. v0.1.0) : construit l'APK et le publie dans une Release GitHub.
# - Push sur une branche : construit l'APK (artefact téléchargeable), sans Release.
#
# Caches : GitHub ne partage un cache qu'avec la même branche/tag ou avec la branche par défaut.
# Les builds de branche sont donc rapides dès le 2e passage ; ceux des tags le deviennent
# une fois que la branche par défaut (main) a été construite.
# - Lancement manuel possible (onglet Actions).
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**', 'design/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Vérifications (types + tests)
        run: |
          npx tsc --noEmit
          npm test -- --ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: SDK Android (préinstallé sur le runner) – licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Par défaut, seul main écrit le cache : on l'autorise partout.
          cache-read-only: false

      # Cache de compilation C++ (React Native, Reanimated, Worklets, Screens, modules Expo…).
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 2G

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          # versionCode Android : doit toujours augmenter pour installer par-dessus.
          echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Clé de signature (si configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "GASPALLI_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore"
              echo "GASPALLI_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
              echo "GASPALLI_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "GASPALLI_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signature avec la clé du dépôt."
          else
            echo "::warning::Aucune clé configurée : APK signé avec la clé de debug standard (test uniquement)."
          fi

      - name: Projet natif (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilation APK
        working-directory: android
        env:
          # CMake (≥ 3.17) lit ces variables : chaque compilation C/C++ passe par ccache.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Chemins et dates de node_modules changent à chaque checkout : on ne s'y fie pas.
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,file_stat_matches,pch_defines
        # arm64-v8a : tous les téléphones Android récents ; compile ~4× plus vite que toutes les ABI.
        # --build-cache : réutilise les sorties Java/Kotlin/dex déjà produites.
        # Mémoire : R8 manquait de Metaspace avec les 2 Go / 512 Mo par défaut.
        # -x lintVitalRelease : le lint n'apporte rien à un APK de test (~15 s).
        run: >
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          --build-cache --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          -x lintVitalRelease

      - name: Statistiques ccache
        if: always()
        run: ccache --show-stats || true

      - name: Nommer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/gaspalli-${APP_VERSION}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: gaspalli-${{ env.APP_VERSION }}
          path: dist/*.apk

      - name: Release GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body_path: docs/release-notes.md
          generate_release_notes: true
