name: Supabase – tests SQL

# Rejoue les migrations sur un Postgres nu et vérifie RLS, foyers et synchronisation.
on:
  push:
    paths: ['supabase/**', 'src/data/ingredients.ts', '.github/workflows/supabase-tests.yml']
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Migrations + tests
        run: supabase/tests/run.sh

  functions:
    # Vérifie les types des Edge Functions (Deno) contre les SDK épinglés dans leur deno.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types des Edge Functions
        run: npx tsc -p supabase/functions
      - name: Logique de génération (Jest)
        run: npx jest __tests__/aiRecipe.test.ts __tests__/aiPayload.test.ts __tests__/exports.test.ts --ci
