name: Supabase – tests SQL

# Rejoue les migrations sur un Postgres nu et vérifie RLS, foyers et synchronisation.
on:
  push:
    paths: ['supabase/**', '.github/workflows/supabase-tests.yml']
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Migrations + tests
        run: supabase/tests/run.sh
