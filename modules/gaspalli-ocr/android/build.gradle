plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.gaspalli'
version = '1.0.0'

android {
  namespace "app.gaspalli.ocr"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Même version que expo-text-extractor : un seul modèle ML Kit, téléchargé par les services Google Play.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
